<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="manifest.json" rel="manifest"/>
<link href="icons/favicon-32.png" rel="icon" type="image/png"/>
<link href="icons/apple-touch-icon.png" rel="apple-touch-icon"/>
<meta content="#171625" name="theme-color"/>
<meta content="yes" name="apple-mobile-web-app-capable"/>
<meta content="black-translucent" name="apple-mobile-web-app-status-bar-style"/>
<meta content="DVpoint" name="apple-mobile-web-app-title"/>
<title>DVpoint — Reset Password</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-client.js"></script>
<style>
  :root {
    --primary: #5b6cff;
    --primary-2: #8b5cf6;
    --success: #34d399;
    --danger: #ef4d8f;
    --text: #f4f3fb;
    --text-muted: #9d9bb3;
    --text-faint: #6f6d84;
    --card-bg: rgba(18, 17, 28, 0.72);
    --card-border: rgba(255,255,255,.08);
    --input-bg: rgba(255,255,255,.04);
    --input-border: rgba(255,255,255,.10);
    --shadow-card: 0 40px 100px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:radial-gradient(ellipse 1200px 800px at 50% -10%, rgba(91,108,255,.18), transparent 60%),
               linear-gradient(160deg, #050509, #0b0a16 60%, #131326);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; color:var(--text);
  }
  .card{
    width:100%; max-width:440px;
    background:var(--card-bg); backdrop-filter:blur(28px) saturate(160%);
    border:1px solid var(--card-border); border-radius:26px;
    box-shadow:var(--shadow-card), 0 0 70px rgba(91,108,255,.05);
    padding:44px 38px 34px;
    animation:cardIn .6s cubic-bezier(.22,1,.36,1) forwards;
  }
  @keyframes cardIn{from{opacity:0; transform:translateY(24px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);}}
  .logo-wrap{
    width:56px; height:56px; margin:0 auto 16px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 12px 32px rgba(91,108,255,.35);
  }
  .logo-wrap img{width:100%; height:100%; object-fit:contain;}
  h1{font-size:19px; font-weight:700; text-align:center; margin-bottom:6px;}
  p.sub{font-size:12.5px; color:var(--text-muted); text-align:center; margin-bottom:28px; line-height:1.5;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:7px; text-transform:uppercase; letter-spacing:.03em;}
  .field-inner{position:relative;}
  .field-inner i.icon-left{position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-faint); font-size:14px;}
  .field input{
    width:100%; padding:13px 42px 13px 40px;
    background:var(--input-bg); border:1.5px solid var(--input-border); border-radius:13px;
    color:var(--text); font-size:14px; font-family:inherit; outline:none;
    transition:border-color .2s ease;
  }
  .field input:focus{border-color:var(--primary);}
  .toggle-pw{position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--text-faint); cursor:pointer; font-size:14px; background:none; border:none;}
  .toggle-pw:hover{color:var(--primary);}
  .btn{
    width:100%; padding:14px; border:none; border-radius:13px;
    background:linear-gradient(90deg, var(--primary), var(--primary-2));
    color:#fff; font-size:14.5px; font-weight:600; font-family:inherit; cursor:pointer;
    box-shadow:0 10px 32px rgba(91,108,255,.35);
    transition:filter .2s ease, transform .2s ease;
    margin-top:6px;
  }
  .btn:hover{filter:brightness(1.08); transform:translateY(-1px);}
  .btn:disabled{opacity:.6; cursor:not-allowed; transform:none;}
  .msg{
    display:none; align-items:flex-start; gap:9px;
    font-size:12.5px; line-height:1.5; padding:12px 14px; border-radius:11px; margin-bottom:16px;
  }
  .msg.error{background:rgba(239,77,143,.1); border:1px solid rgba(239,77,143,.25); color:#ffb3cf;}
  .msg.success{background:rgba(52,211,153,.1); border:1px solid rgba(52,211,153,.25); color:#8ff0ce;}
  .back-link{display:block; text-align:center; margin-top:22px; font-size:12.5px; color:var(--text-muted); text-decoration:none;}
  .back-link:hover{color:var(--primary);}
</style>
</head>
<body>

<div class="card">
  <div class="logo-wrap"><img src="logo.png" alt="DVpoint"/></div>
  <h1>Buat Password Baru</h1>
  <p class="sub">Masukkan password baru untuk akun DVpoint kamu.</p>

  <div class="msg error" id="msgError"></div>
  <div class="msg success" id="msgSuccess"></div>

  <form id="resetForm">
    <div class="field">
      <label>Password Baru</label>
      <div class="field-inner">
        <i class="fas fa-lock icon-left"></i>
        <input id="pwBaru" type="password" placeholder="Minimal 6 karakter" required/>
        <button class="toggle-pw" type="button" id="togglePw1"><i class="fas fa-eye"></i></button>
      </div>
    </div>
    <div class="field">
      <label>Konfirmasi Password</label>
      <div class="field-inner">
        <i class="fas fa-lock icon-left"></i>
        <input id="pwKonfirmasi" type="password" placeholder="Ulangi password" required/>
        <button class="toggle-pw" type="button" id="togglePw2"><i class="fas fa-eye"></i></button>
      </div>
    </div>
    <button class="btn" id="submitBtn" type="submit">Simpan Password Baru</button>
  </form>

  <a class="back-link" href="index.html"><i class="fas fa-arrow-left"></i>&nbsp; Kembali ke halaman Sign In</a>
</div>

<script>
  const msgError = document.getElementById('msgError');
  const msgSuccess = document.getElementById('msgSuccess');
  const form = document.getElementById('resetForm');
  const submitBtn = document.getElementById('submitBtn');

  function showError(text) {
    msgError.textContent = text;
    msgError.style.display = 'flex';
    msgSuccess.style.display = 'none';
  }

  // Supabase otomatis mendeteksi token recovery dari URL (fragment #...)
  // begitu link di email diklik — cukup tunggu sesi siap sebelum form dipakai.
  (async function checkRecoverySession() {
    const { data: { session } } = await dvSupabase.auth.getSession();
    if (!session) {
      showError('Link reset password tidak valid atau sudah kedaluwarsa. Silakan minta link baru dari halaman Sign In.');
      form.style.display = 'none';
    }
  })();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pwBaru = document.getElementById('pwBaru').value;
    const pwKonfirmasi = document.getElementById('pwKonfirmasi').value;

    msgError.style.display = 'none';

    if (pwBaru.length < 6) { showError('Password minimal 6 karakter.'); return; }
    if (pwBaru !== pwKonfirmasi) { showError('Konfirmasi password tidak cocok.'); return; }

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>&nbsp; Menyimpan...';

    try {
      const { error } = await dvSupabase.auth.updateUser({ password: pwBaru });
      if (error) throw error;

      msgSuccess.innerHTML = '<i class="fas fa-circle-check"></i>&nbsp; Password berhasil diganti! Mengarahkan ke Dashboard...';
      msgSuccess.style.display = 'flex';
      form.style.display = 'none';

      setTimeout(() => { window.location.href = 'dashboard.html'; }, 1800);
    } catch (err) {
      showError(err.message || 'Gagal menyimpan password baru.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Simpan Password Baru';
    }
  });

  function wireToggle(btnId, inputId) {
    document.getElementById(btnId).addEventListener('click', () => {
      const input = document.getElementById(inputId);
      const icon = document.querySelector(`#${btnId} i`);
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      icon.className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
    });
  }
  wireToggle('togglePw1', 'pwBaru');
  wireToggle('togglePw2', 'pwKonfirmasi');
</script>

<script src="pwa-register.js"></script>
</body>
</html>
